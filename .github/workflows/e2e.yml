name: Run Postman Collection
on:
  push:
    branches:
      - main
jobs:
  run-postman-collection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Newman
        run: npm install -g newman

      - name: Install html-extra
        run: npm install -g newman-reporter-htmlextra

      - name: Make directory for result
        run: mkdir -p testResult

      - name: Run Postman Collection
        run: newman run "https://api.postman.com/collections/7060916-74068a26-c04b-42dc-a19d-efdf083ce3f8?apikey=${{ secrets.POSTMAN_API_KEY }}" -r cli,htmlextra --reporter-htmlextra-export testResult/htmlreport.html

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Report result
          path: testResult
